name: Real hardware validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Hardware runner to validate
        type: choice
        required: true
        options: [nvidia, amd, intel]

permissions:
  contents: read

jobs:
  nvidia:
    if: inputs.target == 'nvidia'
    runs-on: [self-hosted, linux, x64, nvidia, cuda]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install and validate CUDA
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript tools/validate-hardware.R cuda | tee validation-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvidia-validation
          path: validation-output.txt

  amd:
    if: inputs.target == 'amd'
    runs-on: [self-hosted, linux, x64, amd, rocm]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install and validate ROCm
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript tools/validate-hardware.R rocm | tee validation-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amd-validation
          path: validation-output.txt

  intel:
    if: inputs.target == 'intel'
    runs-on: [self-hosted, linux, x64, intel, opencl]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install and validate OpenCL
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript tools/validate-hardware.R opencl | tee validation-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-validation
          path: validation-output.txt
